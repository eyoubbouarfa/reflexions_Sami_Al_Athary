name: Ranger les PDF avec les audios (une fois)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  migrer:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/mig
          gh release download enregistrements -D /tmp/mig --clobber || true
          gh release view cours >/dev/null 2>&1 || gh release create cours --title "Cours : audios et PDF" --notes "Audios enregistrés depuis l'appli, PDF et transcriptions des cours. Ne pas supprimer : l'appli lit les fichiers ici."
          gh release upload cours /tmp/mig/*.mp3 data/pdf/*.pdf data/transcriptions/*.json --clobber
          gh release view cours --json assets -q '.assets[].name'
          gh release delete enregistrements --yes --cleanup-tag || true
