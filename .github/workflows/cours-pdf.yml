name: PDF des cours

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Numéros des posts à traiter, séparés par des espaces (ex : 1823 1814)"
        required: true

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install faster-whisper yt-dlp reportlab matplotlib
      - name: Transcrire (français seulement)
        run: python outils/transcrire_ci.py ${{ inputs.ids }}
      - name: Construire les PDF
        run: python outils/cours_pdf.py ${{ inputs.ids }}
      - name: Publier
        run: |
          git config user.name "Eyoub Bouarfa"
          git config user.email "eyoubbouarfa@users.noreply.github.com"
          git add data/transcriptions data/pdf data/pdfs.json
          git commit -m "PDF des cours ${{ inputs.ids }}" && git pull --rebase && git push
