name: Synchronisation des cours

on:
  schedule:
    - cron: "17 5-21 * * *"   # toutes les heures de 6 h à 22 h (heure de Paris)
  workflow_dispatch:
    inputs:
      tout:
        description: "Relire tout le canal (dates, cours manquants)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yt-dlp
      - name: Lire Telegram et SoundCloud
        run: python outils/synchro.py ${{ inputs.tout && '--tout' || '' }}
      - name: Adresses complètes SoundCloud (lecteur intégré)
        run: python outils/resoudre_sc.py || true
      - name: Publier les nouveautés
        run: |
          git config user.name "Eyoub Bouarfa"
          git config user.email "eyoubbouarfa@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des cours" && git push)
      - name: Lancer la fabrication des PDF des nouveaux cours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS=$(cat /tmp/nouveaux.txt 2>/dev/null | xargs)
          if [ -n "$IDS" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/cours-pdf.yml/dispatches" -f ref=main -f "inputs[ids]=$IDS"
            echo "PDF demandés : $IDS"
          fi
