name: Décisions de Sami (PDF, titres, classement)

# Toutes les heures : applique les décisions de Sami (tampon ajouté ou enlevé, PDF retiré ou remis,
# titre, livre ou numéro d'un cours changé, livre ajouté).
# À la main, on peut aussi refaire des PDF à partir de leur transcription (« tous » pour tous).
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      refaire:
        description: "PDF à refaire depuis leur transcription (numéros, ou « tous »)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publier-pdf
  cancel-in-progress: false

jobs:
  tamponner:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Décisions de Sami
        id: q
        run: |
          if [ -n "${{ inputs.refaire }}" ]; then python3 outils/tamponner.py --refaire "${{ inputs.refaire }}"; else python3 outils/tamponner.py; fi
          # Corrections de Sami (titre, livre, numéro) : PDF refait pour les cours modifiés qui en ont un
          python3 outils/corriger.py || { echo "{}" > /tmp/corrections.json; : > /tmp/corriges.txt; }
          for i in $(cat /tmp/corriges.txt); do grep -qw "$i" data/pdfs.json && echo -n " $i" >> /tmp/a_refaire.txt; done
          echo "refaire=$(cat /tmp/a_refaire.txt)" >> "$GITHUB_OUTPUT"
          echo "retirer=$(cat /tmp/a_retirer.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.q.outputs.retirer != ''
        name: Retirer des PDF
        run: for i in ${{ steps.q.outputs.retirer }}; do gh release delete-asset cours "$i.pdf" --yes || true; done
      - if: steps.q.outputs.refaire != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.q.outputs.refaire != ''
        name: Refaire des PDF depuis leur transcription
        run: |
          pip install -q reportlab matplotlib
          mkdir -p data/transcriptions data/ia
          for i in ${{ steps.q.outputs.refaire }}; do
            gh release download cours -p "$i.json" -D data/transcriptions --clobber || { echo "Pas de transcription pour $i"; continue; }
            gh release download cours -p "$i.ia.json" -D /tmp --clobber 2>/dev/null && cp "/tmp/$i.ia.json" "data/ia/$i.json" || true
            python outils/cours_pdf.py $i && gh release upload cours "data/pdf/$i.pdf" --clobber
          done
      - name: Publier
        run: |
          cp data/validations.json /tmp/validations.json
          git config user.name "Eyoub Bouarfa"
          git config user.email "eyoubbouarfa@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/validations.json data/validations.json
            python3 outils/corriger.py --fichier /tmp/corrections.json
            python3 outils/liste_pdf.py
            git add data/validations.json data/pdfs.json data/episodes.json data/series.json
            [ -f data/livres_ajoutes.json ] && git add data/livres_ajoutes.json
            git diff --cached --quiet && exit 0
            git commit -qm "Décisions de Sami sur les cours"
            git push -q && exit 0
            sleep $((i*7))
          done
          exit 1
