<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sami al Athary · Cours</title>
<meta name="description" content="Cours, prêches et rappels du frère Sami al Athary, classés par thème et par livre étudié.">
<meta name="theme-color" content="#0E3B2C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8F5; --surface:#FFFFFF; --ink:#11261D; --muted:#5D6F66; --line:#DCE6DF;
  --green:#0E3B2C; --green-2:#14523D; --gold:#A8833F; --gold-2:#C9A45E; --gold-soft:#F5EDDB; --ok:#1F7A4A;
  --night:var(--green);
  --display:"Cormorant Garamond",Georgia,serif; --body:"Inter",system-ui,sans-serif; --ar:"Amiri","Traditional Arabic",serif;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09160F; --surface:#10221A; --ink:#EEF3EF; --muted:#9DB0A6; --line:#1E3529; --gold:#D2AF6B; --gold-soft:#1D2B20; --green:#0B2E22;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);min-height:100vh;padding-bottom:calc(74px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.ar{font-family:var(--ar);direction:rtl}
header.top{background:var(--green);color:#fff;border-bottom:2px solid var(--gold-2);padding:calc(14px + var(--safe-t)) 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold-2)}
header.top h1{font:600 21px/1.1 var(--display);letter-spacing:.3px}
header.top small{display:block;font:500 11px var(--body);color:var(--gold-2);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
header.top .back{width:36px;height:36px;border-radius:50%;display:none;place-items:center;background:rgba(255,255,255,.12);font-size:20px;flex:none}
header.top.sub .back{display:grid}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font:600 24px/1.2 var(--display);margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font:600 19px/1.25 var(--display)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;text-decoration:none}
.row:active{transform:scale(.99)}
.row .num{flex:none;min-width:40px;height:40px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font:700 15px var(--body);padding:0 6px}
.row .txt{flex:1;min-width:0}
.row .t1{font-weight:600;line-height:1.3}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);flex:none}
.row.done .num{background:transparent;border:1.5px solid var(--ok);color:var(--ok)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
.hero .tag{background:rgba(201,164,94,.18);color:var(--gold-2)}
.tag.live{background:#B3261E;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.theme{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:space-between}
.theme .ar{font-size:20px;color:var(--gold);text-align:right}
.theme b{font:600 18px/1.2 var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;font:inherit;color:inherit;padding:12px 0;outline:none;font-size:16px}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.hero{background:linear-gradient(150deg,var(--green) 0%,var(--green-2) 100%);color:#fff;border:1px solid rgba(201,164,94,.45);border-radius:18px;padding:20px;position:relative;overflow:hidden}
.hero h3{color:#fff;font-size:22px;margin:6px 0 4px}
.hero p{color:#CFE0D6;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:600;background:var(--green);color:#fff;text-decoration:none;font-size:14px}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#fff}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.player{border:0;width:100%;height:166px;border-radius:12px;margin-top:14px;background:var(--gold-soft)}
.notes{font-size:16px;line-height:1.7}
.notes h4{font:600 20px var(--display);margin:18px 0 6px}
.notes p{margin:8px 0}
.notes .ar{font-size:22px;line-height:1.9;margin:10px 0;padding:10px 14px;background:var(--gold-soft);border-radius:10px;text-align:right}
.notes figure{margin:14px 0}.notes figure img,.notes figure svg{width:100%;border-radius:10px}
mark{background:#F1DFAF;color:#11261D;border-radius:3px;padding:0 2px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--safe-b));z-index:6}
nav.tabs a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:4px 0}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--green)}
@media (prefers-color-scheme:dark){nav.tabs a.on{color:var(--gold)}}
nav.tabs a .dot{width:7px;height:7px;border-radius:50%;background:#B3261E;position:absolute;margin-left:14px;display:none}
nav.tabs a.live .dot{display:block}
.prog{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;font-weight:500}
.card h3+.prog,.card div+.prog{margin-top:6px}
.card.today{border-color:var(--gold-2);box-shadow:0 0 0 1px var(--gold-2) inset}
.bienvenue{background:linear-gradient(160deg,var(--green) 0%,var(--green-2) 100%);color:#E6F0EA;border-radius:18px;padding:22px 20px;margin-bottom:14px;border:1px solid rgba(201,164,94,.45);font-size:15px;line-height:1.6}
.bienvenue strong{color:#fff}
.horaires{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.horaires div{background:rgba(255,255,255,.07);border:1px solid rgba(201,164,94,.35);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.horaires .tag{background:rgba(201,164,94,.18);color:var(--gold-2);align-self:flex-start}
.horaires b{color:#fff;font:600 19px/1.2 var(--display)}
.horaires span:last-child{font-size:12.5px;color:#BFD3C8}
.adresse{font-size:12px;color:#BFD3C8;margin-top:6px}
.porte .infos .adr{display:block;font-size:11px;opacity:.7;margin-top:4px}
.ce-jour{margin-top:12px;padding-top:12px;border-top:1px solid rgba(201,164,94,.3);color:#fff;font-size:14.5px}
.ce-jour b{color:var(--gold-2)}
.more{display:block;margin:12px auto 0;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
footer{text-align:center;font-size:12px;color:var(--muted);padding:26px 0 6px}

/* ---------- Écran d'entrée ---------- */
.porte{position:fixed;left:0;right:0;top:0;height:var(--ecran,100svh);z-index:50;background:radial-gradient(120% 80% at 50% 28%,#1A6B4E,#06281C);color:#fff;display:grid;place-items:center;padding:calc(calc(2*var(--vh1,1vh)) + var(--safe-t)) 22px calc(calc(2*var(--vh1,1vh)) + var(--safe-b));text-align:center;transition:opacity .5s;overflow:hidden}
.porte.out{opacity:0;pointer-events:none}
.porte .in{display:grid;gap:clamp(6px,calc(1.6*var(--vh1,1vh)),14px);max-width:520px;width:100%;}
.porte .logo{width:clamp(60px,calc(13*var(--vh1,1vh)),128px);height:clamp(60px,calc(13*var(--vh1,1vh)),128px);justify-self:center;border-radius:50%;box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 0 2px rgba(201,164,94,.7)}
.porte h1{font:600 clamp(24px,calc(4*var(--vh1,1vh)),32px)/1.1 var(--display);letter-spacing:.3px;margin-top:4px}
.porte .devise{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-2)}
.porte .filet{display:none;width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);justify-self:center;margin:4px 0}
.porte .genre{justify-self:center;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#15241C;background:var(--gold-2);border-radius:99px;padding:3px 12px}
.porte .har{font-family:var(--ar);font-size:clamp(16px,calc(2.8*var(--vh1,1vh)),24px);line-height:1.6;direction:rtl;color:#F1DFAF}
.porte .hfr{font:italic 600 clamp(15px,calc(2.5*var(--vh1,1vh)),21px)/1.28 var(--display);text-wrap:balance}
.porte .href{font-size:12px;opacity:.75}
.porte .infos{font-size:clamp(12px,calc(1.7*var(--vh1,1vh)),13.5px);line-height:1.5;color:#CFE0D6;background:rgba(255,255,255,.06);border:1px solid rgba(201,164,94,.3);border-radius:14px;padding:12px 14px}
.porte .infos b{color:#fff}
.porte .entrer{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,calc(1.2*var(--vh1,1vh)),10px);padding:clamp(10px,calc(1.6*var(--vh1,1vh)),14px) 0;width:56px;border-radius:99px;background:linear-gradient(180deg,#D9B873,#A8833F);color:#15241C;font:800 clamp(13px,calc(2*var(--vh1,1vh)),16px)/1 var(--body);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.porte .bas{display:flex;gap:10px;align-items:stretch;margin-bottom:clamp(40px,calc(9*var(--vh1,1vh)),80px)}
.porte .bas .infos{flex:1;display:flex;flex-direction:column;justify-content:center}
.porte .entrer .lettres{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:clamp(0px,.calc(3*var(--vh1,1vh)),2px)}
.porte .entrer .ring{position:relative;width:18px;height:18px;display:grid;place-items:center}
.porte .entrer .ring::before,.porte .entrer .ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #15241C;animation:ripple 1.6s ease-out infinite}
.porte .entrer .ring::after{animation-delay:.8s}
.porte .entrer .ring i{width:7px;height:7px;border-radius:50%;background:#15241C}
@keyframes ripple{from{transform:scale(.5);opacity:.9}to{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.porte,.porte .entrer .ring::before,.porte .entrer .ring::after{animation:none;transition:none}}
@media print{
  header.top,nav.tabs,.btns,.noprint{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:0;padding:0}
  .notes .ar{background:#f4efe4}
}
</style>
</head>
<body>
<div class="porte" id="porte" role="dialog" aria-label="Entrée"><div class="in" id="porteIn"></div></div>
<header class="top" id="top">
  <button class="back" onclick="history.back()" aria-label="Retour">‹</button>
  <img src="icons/logo.png" alt="">
  <div><h1>Sami al Athary</h1><small>Science · Rappels · Bénéfices</small></div>
</header>
<main id="app"><p class="empty">Chargement des cours…</p></main>
<nav class="tabs" id="tabs">
  <a href="#accueil" data-t="accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#themes" data-t="themes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/><path d="M6 9h2M16 9h2"/></svg>Thèmes</a>
  <a href="#preches" data-t="preches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M5 21V11a7 7 0 0 1 14 0v10M3 21h18M9 21v-5a3 3 0 0 1 6 0v5"/></svg>Vendredi</a>
  <a href="#sources" data-t="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5V19.5"/></svg>Sources</a>
  <a href="#recherche" data-t="recherche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Recherche</a>

</nav>
<script>
"use strict";
const D = {themes:[], series:[], eps:[], conf:{}, textes:{}, byId:new Map(), bySerie:new Map(), serie:new Map()};
const $app = document.getElementById("app");

/* ---------- mémoire locale : cours écoutés ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let ecoutes = new Set(store.get("ecoutes", []));
function basculerEcoute(id){ ecoutes.has(id) ? ecoutes.delete(id) : ecoutes.add(id); store.set("ecoutes", [...ecoutes]); }

/* ---------- utilitaires ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[ً-ٰٟ]/g, "").toLowerCase().replace(/[’']/g, "'");
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
function dateFr(d){ if(!d) return ""; const [y, m, j] = d.split("-").map(Number); return `${j} ${MOIS[m - 1]} ${y}`; }
const chev = '<span class="chev">›</span>';
function titreEp(e){
  const s = D.serie.get(e.serie);
  return e.titre || (e.num != null ? `Épisode ${e.num}` : s.nom);
}
function ligneEp(e, avecSerie){
  const s = D.serie.get(e.serie);
  const sous = [avecSerie ? s.nom : "", dateFr(e.date), e.fin ? "Dernier épisode" : "", D.textes[e.id] ? "Notes disponibles" : ""].filter(Boolean).join(" · ");
  return `<a class="row ${ecoutes.has(e.id) ? "done" : ""}" href="#ep-${e.id}">
    <span class="num">${e.num != null ? e.num : "•"}</span>
    <span class="txt"><span class="t1">${esc(titreEp(e))}</span>${sous ? `<span class="t2" style="display:block">${esc(sous)}</span>` : ""}</span>${chev}</a>`;
}
function progression(sid){
  const eps = D.bySerie.get(sid) || [];
  const n = eps.filter(e => ecoutes.has(e.id)).length;
  return {n, total: eps.length, pct: eps.length ? Math.round(100 * n / eps.length) : 0};
}
function prochainEp(sid){
  const eps = [...(D.bySerie.get(sid) || [])].sort(ordreSerie);
  return eps.find(e => !ecoutes.has(e.id)) || eps[eps.length - 1];
}
const ordreSerie = (a, b) => (a.num ?? 1e9) - (b.num ?? 1e9) || a.id - b.id;
function lot(items, rendu, taille = 40){
  // affiche une longue liste par paquets
  const id = "l" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const box = document.getElementById(id); if(!box) return;
    let i = 0;
    const plus = () => {
      box.insertAdjacentHTML("beforeend", items.slice(i, i + taille).map(rendu).join(""));
      i += taille;
      const b = box.nextElementSibling;
      if(i >= items.length && b && b.classList.contains("more")) b.remove();
    };
    plus();
    const b = box.nextElementSibling; if(b) b.onclick = plus;
  });
  return `<div class="list" id="${id}"></div>${items.length > taille ? '<button class="more">Afficher plus</button>' : ""}`;
}

/* ---------- vues ---------- */
function heureEte(d = new Date()){
  // Heure d'été en France : du dernier dimanche de mars au dernier dimanche d'octobre
  const dernierDim = m => { const x = new Date(d.getFullYear(), m + 1, 0); x.setDate(x.getDate() - x.getDay()); return x; };
  return d >= dernierDim(2) && d < dernierDim(9);
}
function coucher(date, lat, lon){
  // Heure du coucher du soleil (Maghrib) à ±2 min, algorithme NOAA
  const rad = Math.PI / 180, j = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 864e5);
  const g = 2 * Math.PI / 365 * (j - 1 + 0.5);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
  const minutesUTC = 720 - 4 * (lon - ha) - eq;
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0) + minutesUTC * 6e4);
  return d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris"}).replace(":", " h ");
}
function infoDuJour(){
  const c = D.conf, now = new Date(), j = new Date().toLocaleDateString("fr-FR", {weekday: "long", timeZone: "Europe/Paris"});
  if(!c.lat) return "";
  if(["mardi", "jeudi", "dimanche"].includes(j)) return `Ce soir : cours après Maghrib, vers <b>${coucher(now, c.lat, c.lon)}</b>`;
  if(j === "vendredi") return `Aujourd'hui : prêche du vendredi à <b>${esc(heureEte() ? c.horaires.jumua_ete : c.horaires.jumua_hiver)}</b>`;
  return "";
}
function vueBienvenue(){
  const h = D.conf.horaires || {}; const ete = heureEte();
  return `<section class="bienvenue">
    <p class="ar" style="font-size:24px;color:var(--gold-2);text-align:center;margin-bottom:6px">بسم الله الرحمن الرحيم</p>
    <h2 style="margin:0 0 8px;color:#fff">Bienvenue</h2>
    <p>Cette application rassemble les cours, prêches et rappels du frère <strong>Sami al Athary</strong>, donnés à la <strong>${esc(D.conf.mosquee || "mosquée")}</strong>.
    Chaque cours suit un livre de science, lu et expliqué passage après passage.</p>
    ${D.conf.adresse ? `<p class="adresse">📍 ${esc(D.conf.adresse)}</p>` : ""}
    <div class="horaires">
      <div><span class="tag">Cours</span><b>${esc(h.cours_jours || "")}</b><span>${esc(h.cours_moment || "")}</span></div>
      <div><span class="tag">Prêche du vendredi</span><b>${esc(ete ? h.jumua_ete : h.jumua_hiver)}</b><span>${ete ? "horaire d'été" : "horaire d'hiver"} · ${esc(ete ? h.jumua_hiver : h.jumua_ete)} ${ete ? "en hiver" : "en été"}</span></div>
    </div>
    ${infoDuJour() ? `<p class="ce-jour">${infoDuJour()}</p>` : ""}
  </section>`;
}
function vueAccueil(){
  const live = D.conf.direct && D.conf.direct.actif;
  const recents = D.eps.slice(0, 8);

function programmeReel(){
  // Jour de chaque livre en cours, déduit des dates réelles de ses 8 derniers cours (pas de la cadence)
  const parJour = new Map();
  D.series.filter(s => s.statut === "en cours").forEach(s => {
    const dates = (D.bySerie.get(s.id) || []).filter(e => e.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    if(!dates.length) return;
    const compte = {}; dates.forEach(e => { const j = new Date(e.date + "T12:00:00").getDay(); compte[j] = (compte[j] || 0) + 1; });
    const [jour, n] = Object.entries(compte).sort((a, b) => b[1] - a[1])[0];
    if(n < dates.length / 2) return;
    if(!parJour.has(+jour)) parJour.set(+jour, []);
    parJour.get(+jour).push(s.id);
  });
  return [...parJour.entries()].sort((a, b) => ((a[0] + 7) % 7) - ((b[0] + 7) % 7)).map(([n, series]) => ({jour: JOURS[n], n, series}));
}

function surligner(txt, mots){
  // surlignage insensible aux accents : on cherche dans le texte normalisé, on marque dans le texte d'origine
  const src = [...String(txt ?? "")];
  let n = "", carte = [];
  src.forEach((c, i) => { const k = norm(c); for(const _ of k){ n += _; carte.push(i); } });
  const marque = new Array(src.length).fill(false);
  mots.filter(m => m.length >= 2).forEach(m => {
    let p = 0, i;
    while((i = n.indexOf(m, p)) !== -1){ for(let j = i; j < i + m.length; j++) marque[carte[j]] = true; p = i + m.length; }
  });
  let h = "", ouvert = false;
  src.forEach((c, i) => {
    if(marque[i] && !ouvert){ h += "<mark>"; ouvert = true; }
    if(!marque[i] && ouvert){ h += "</mark>"; ouvert = false; }
    h += esc(c);
  });
  return h + (ouvert ? "</mark>" : "");
}
function extrait(texte, q){
  const n = norm(texte), i = n.indexOf(q);
  if(i < 0) return "";
  const a = Math.max(0, i - 70), b = Math.min(texte.length, i + q.length + 90);
  return (a ? "…" : "") + texte.slice(a, b) + (b < texte.length ? "…" : "");
}
function rechercher(brut){
  const q = norm(brut.trim());
  if(q.length < 2) return `<div class="empty">Tape au moins deux lettres.<br><span class="small">Exemples : « Omar », « witr », « hypocrites », « Al Kahf », « purification ».</span></div>`;
  const mots = q.split(/\s+/).filter(Boolean);
  const res = [];
  for(const e of D.eps){
    const s = D.serie.get(e.serie);
    const titre = titreEp(e);
    const meta = norm([titre, s.nom, s.livre, s.auteur, e.num].join(" "));
    const texte = D.textes[e.id] ? D.textes[e.id].texte : "";
    const tn = norm(texte);
    let score = 0, ext = "";
    if(meta.includes(q)) score += 10;
    else if(mots.every(m => meta.includes(m))) score += 6;
    if(texte){
      if(tn.includes(q)){ score += 8; ext = extrait(texte, q); }
      else if(mots.every(m => tn.includes(m))){ score += 3; ext = extrait(texte, mots[0]); }
    }
    if(score) res.push({e, s, score, ext, titre});
  }
  if(!res.length) return `<div class="empty">Aucun cours trouvé pour « ${esc(brut)} ».</div>`;
  res.sort((a, b) => b.score - a.score || b.e.id - a.e.id);
  return `<p class="muted small" style="margin-bottom:8px">${res.length} résultat${res.length > 1 ? "s" : ""}</p>` + lot(res, r => `
    <a class="row" href="#ep-${r.e.id}" style="align-items:flex-start"><span class="num">${r.e.num ?? "•"}</span>
    <span class="txt"><span class="t1">${surligner(r.titre, [q, ...mots])}</span>
    <span class="t2" style="display:block">${surligner(r.s.nom, [q, ...mots])}</span>
    ${r.ext ? `<span class="small" style="display:block;margin-top:4px">${surligner(r.ext, [q, ...mots])}</span>` : ""}</span>${chev}</a>`, 30);
}

  inn.innerHTML = `<img class="logo" src="icons/logo.png" alt="">
    <div><h1>Sami al Athary</h1><div class="devise">Science · Rappels · Bénéfices</div></div>
    <div class="filet"></div>
    <div class="genre">${esc(h.type)}</div>
    <div class="har">${esc(h.ar)}</div>
    <div class="hfr">${h.type.startsWith("Invocation coranique") ? esc(h.fr) : "« " + esc(h.fr) + " »"}</div>
    <div class="href">${esc(h.ref)}</div>
    <div class="bas"><div class="infos"><span>Cours donnés à la <b>${esc(D.conf.mosquee || "mosquée")}</b><br>
      <b>${esc(hr.cours_jours || "")}</b>, ${esc((hr.cours_moment || "").replace(/^Entre/, "entre"))}<br>
      Prêche du vendredi à <b>${esc(ete ? hr.jumua_ete : hr.jumua_hiver)}</b>
      ${D.conf.adresse ? `<span class="adr">${esc(D.conf.adresse)}</span>` : ""}</span></div>
    <button class="entrer" id="entrer" aria-label="Entrer"><span class="ring"><i></i></span><span class="lettres">ENTRER</span></button></div>`;
  const fermer = () => { el.classList.add("out"); setTimeout(() => el.remove(), 550); compter("/entrer", "Bouton Entrer", true); };
  document.getElementById("entrer").onclick = fermer;
}


/* ---------- Comptage anonyme (GoatCounter) : aucun nom, aucun cookie, aucune adresse IP conservée ---------- */
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function compter(chemin, titre, evenement){
  try{
    const code = D.conf.goatcounter; if(!code || !navigator.onLine || /localhost|claude/.test(location.hostname)) return;
    const q = new URLSearchParams({p: chemin, t: titre || chemin, s: [screen.width, screen.height, devicePixelRatio || 1].join(","), rnd: Math.random().toString(36).slice(2)});
    if(evenement) q.set("e", "true");
    new Image().src = `https://${code}.goatcounter.com/count?` + q.toString();
  }catch(e){}
}
function compterVue(){
  const h = (location.hash || "#accueil").slice(1), [route, ...r] = h.split("-"), arg = r.join("-");
  if(route === "ep"){ const e = D.byId.get(+arg); if(e){ const s = D.serie.get(e.serie); compter(`/cours/${s.id}/${e.num ?? e.id}`, `${s.nom} · ${e.num != null ? "n° " + e.num : titreEp(e)}`); } return; }
  if(route === "serie"){ const s = D.serie.get(arg); if(s) compter(`/serie/${s.id}`, s.nom); return; }
  if(route === "theme"){ compter(`/theme/${arg}`, `Thème : ${arg}`); return; }
  compter(`/onglet/${route}`, `Onglet ${route}`);
}
document.addEventListener("click", ev => {
  const a = ev.target.closest("a"); if(!a) return;
  if(/\/pdf\//.test(a.getAttribute("href") || "")) compter("pdf-" + a.getAttribute("href").split("/").pop(), "Téléchargement PDF", true);
  else if(/soundcloud|t\.me/.test(a.href) && /Écouter|SoundCloud/.test(a.textContent)) compter("ecoute-" + (location.hash.split("-")[1] || ""), "Écoute d'un cours", true);
});

/* ---------- chargement ---------- */
async function charger(nom, defaut){
  try{ const r = await fetch("data/" + nom, {cache: "no-cache"}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return defaut; }
}
(async () => {
  const [ser, eps, conf, textes, pdfs] = await Promise.all([charger("series.json", {themes: [], series: []}), charger("episodes.json", []), charger("config.json", {}), charger("textes.json", {}), charger("pdfs.json", [])]);
  D.themes = ser.themes; D.series = ser.series; D.eps = eps; D.conf = conf; D.textes = textes || {}; D.pdfs = new Set(pdfs || []);
  D.series.forEach(s => D.serie.set(s.id, s));
  D.eps = D.eps.filter(e => D.serie.has(e.serie));
  D.eps.forEach(e => { D.byId.set(e.id, e); if(!D.bySerie.has(e.serie)) D.bySerie.set(e.serie, []); D.bySerie.get(e.serie).push(e); });
  if(!D.eps.length){ $app.innerHTML = '<div class="empty">Impossible de charger les cours. Vérifie ta connexion.</div>'; return; }
  ouvrirPorte();
  afficher();
  compter(STANDALONE ? "/ouverture/appli-installee" : "/ouverture/navigateur", STANDALONE ? "Ouverture depuis l'icône" : "Ouverture dans le navigateur");
})();
if("serviceWorker" in navigator && location.protocol === "https:" && !/claude|anthropic/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
